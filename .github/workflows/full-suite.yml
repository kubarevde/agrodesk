# Full suite: backend pytest + bot tests + Vitest + all Playwright e2e.
# Does not replace fast CI / PR e2e — run via workflow_dispatch or nightly cron.

name: Full suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrodesk
          POSTGRES_PASSWORD: agrodesk
          POSTGRES_DB: agrodesk_full
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrodesk -d agrodesk_full"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agrodesk:agrodesk@localhost:5432/agrodesk_full
      SECRET_KEY: ci-full-secret
      BOT_INTERNAL_SECRET: ci-full-bot-secret
      ALLOWED_ORIGINS: http://localhost:5173
      API_URL: http://127.0.0.1:8000
      API_BASE_URL: http://127.0.0.1:8000
      RUN_SEED_ON_START: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Migrate, seed, start API, pytest
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          pytest tests -q --tb=line

  bot:
    name: Bot unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pytest bot
        working-directory: bot
        run: |
          pip install -r requirements.txt || pip install pytest pytest-asyncio httpx
          pip install -e . 2>/dev/null || true
          PYTHONPATH=. pytest tests -q --tb=line

  frontend:
    name: Lint & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: Playwright full e2e
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrodesk
          POSTGRES_PASSWORD: agrodesk
          POSTGRES_DB: agrodesk_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrodesk -d agrodesk_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agrodesk:agrodesk@localhost:5432/agrodesk_e2e
      SECRET_KEY: ci-e2e-secret-key
      BOT_INTERNAL_SECRET: ci-e2e-bot-secret
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      API_URL: http://127.0.0.1:8000
      API_BASE_URL: http://127.0.0.1:8000
      VITE_API_URL: http://127.0.0.1:8000
      RUN_SEED_ON_START: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Backend up
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-e2e.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat /tmp/uvicorn-e2e.log; exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run shifts + messenger + shipment e2e
        run: npm run test:e2e:full
