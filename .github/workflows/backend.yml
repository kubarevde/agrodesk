# Backend CI: Postgres 16 service + Alembic + seed + pytest against live uvicorn.
# Does NOT touch production VPS. Schema check + API tests only.

name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  backend:
    name: Alembic + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrodesk
          POSTGRES_PASSWORD: agrodesk
          POSTGRES_DB: agrodesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrodesk -d agrodesk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://agrodesk:agrodesk@localhost:5432/agrodesk_ci
      SECRET_KEY: ci-secret-key-not-for-production
      BOT_INTERNAL_SECRET: ci-bot-secret
      JWT_EXPIRE_MINUTES: '1440'
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      API_URL: http://127.0.0.1:8000
      API_BASE_URL: http://127.0.0.1:8000
      UPLOADS_DIR: ./uploads
      SUPERADMIN_EMAIL: admin@agrodesk.local
      SUPERADMIN_PASSWORD: ChangeMe123!
      RUN_SEED_ON_START: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Seed demo data
        run: python -m app.seed

      - name: Start uvicorn
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-ci.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/uvicorn-ci.log; exit 1

      - name: pytest
        run: PYTHONPATH=. pytest tests/ -q --tb=short
